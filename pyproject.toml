[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vibecheck"
version = "0.1.0"
description = "Lightweight vibration analysis from accelerometer CSV data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "mhaklee", email = "myeonghaklee.contact@gmail.com" }
]
keywords = ["vibration", "accelerometer", "FFT", "signal-processing", "mechanical-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.11.0",
  "matplotlib>=3.7.0",
  "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
]

[project.scripts]
vibecheck = "vibecheck.cli:main"

[project.urls]
Homepage = "https://github.com/mhaklee/vibecheck-vibration-analyzer"
Issues = "https://github.com/mhaklee/vibecheck-vibration-analyzer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibecheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["vibecheck"]
omit = ["tests/*", "vibecheck/app.py"]
